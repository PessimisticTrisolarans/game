        function drawCellAt(row, col, x, y, board, revealed, flagged, flashMine = false) {
            const cellSize = game.cellSize;
            const gap = game.gap || 0;
            const effective = cellSize + gap;
            
            const root = document.body; 
            
            const theme = document.body.dataset.theme;

            const unrevealedColor = getComputedStyle(root).getPropertyValue('--cell-unrevealed').trim();
            const revealedColor = getComputedStyle(root).getPropertyValue('--cell-revealed').trim();
            const borderColor = getComputedStyle(root).getPropertyValue('--cell-border').trim();
            const borderWidth = parseFloat(getComputedStyle(root).getPropertyValue('--border-width')) || 0.5;
            const bevel = getComputedStyle(root).getPropertyValue('--tile-bevel').trim();
            const flagColor = getComputedStyle(root).getPropertyValue('--flag-color').trim();
            const questionColor = getComputedStyle(root).getPropertyValue('--question-color').trim();
            const radius = parseInt(getComputedStyle(root).getPropertyValue('--tile-radius')) || 0;
            const numberColors = getComputedStyle(root).getPropertyValue('--number-colors').split(',').map(c => c.trim());
            const mineEmoji = getComputedStyle(root).getPropertyValue('--mine-emoji').trim();
            const fontSizeRatio = parseFloat(getComputedStyle(root).getPropertyValue('--number-font-size-ratio')) || 0.5;
            const numShadow = getComputedStyle(root).getPropertyValue('--num-shadow').trim();

            let numberFont = 'Arial';
            if (theme === 'retro') numberFont = "'Press Start 2P', monospace";
            else if (theme === 'flat') numberFont = "-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif";
            else if (theme === 'nature') numberFont = "'Caveat', 'ZCOOL KuaiLe', cursive";
            else numberFont = 'Arial';

            const drawX = x + gap / 2;
            const drawY = y + gap / 2;
            const size = cellSize;
            const isHovered = (hoveredCell.row === row && hoveredCell.col === col);
            const isPressed = pressedCells.has(`${row},${col}`);

            if (revealed[row][col]) {
                if (flashMine) {
                    ctx.fillStyle = '#ff0000';
                } else {
                    ctx.fillStyle = revealedColor;
                }
                if (theme === 'retro') {
                    ctx.fillRect(drawX, drawY, size, size);
                    ctx.fillStyle = '#808080';
                    ctx.fillRect(drawX, drawY, size, 3);
                    ctx.fillRect(drawX, drawY, 3, size);
                    ctx.fillStyle = '#ffffff';
                    ctx.fillRect(drawX, drawY + size - 3, size, 3);
                    ctx.fillRect(drawX + size - 3, drawY, 3, size);
                } else if (theme === 'flat') {
                    ctx.beginPath();
                    ctx.roundRect(drawX, drawY, size, size, radius);
                    ctx.fill();
                } else if (theme === 'nature') {
                    ctx.save();
                    ctx.translate(drawX, drawY);
                    const offX = getNatureOffset(row, col, size);
                    const offY = getNatureOffset(row + 7, col + 13, size);
                    ctx.beginPath();
                    const pts = [
                        [0 + offX, 0 + offY],
                        [size + offX, 0 + offY],
                        [size + offX, size + offY],
                        [0 + offX, size + offY]
                    ];
                    ctx.moveTo(pts[0][0], pts[0][1]);
                    for (let i = 1; i < pts.length; i++) {
                        ctx.lineTo(pts[i][0], pts[i][1]);
                    }
                    ctx.closePath();
                    ctx.fill();
                    ctx.strokeStyle = borderColor;
                    ctx.lineWidth = 2;
                    ctx.setLineDash([5, 3]);
                    ctx.stroke();
                    ctx.setLineDash([]);
                    ctx.restore();
                } else {
                    if (radius > 0) {
                        ctx.beginPath();
                        ctx.roundRect(drawX, drawY, size, size, radius);
                        ctx.fill();
                    } else {
                        ctx.fillRect(drawX, drawY, size, size);
                    }
                }

                if (theme !== 'retro' && theme !== 'flat' && theme !== 'nature') {
                    ctx.strokeStyle = borderColor;
                    ctx.lineWidth = borderWidth;
                    if (radius > 0) {
                        ctx.beginPath();
                        ctx.roundRect(drawX, drawY, size, size, radius);
                        ctx.stroke();
                    } else {
                        ctx.strokeRect(drawX, drawY, size, size);
                    }
                }

                if (board[row][col] === -1) {
                    if (theme === 'retro') {
                        const pix = Math.max(2, Math.floor(size / 8));
                        const cx = drawX + size/2, cy = drawY + size/2;
                        const rad = size * 0.3;
                        ctx.fillStyle = '#000';
                        for (let i = -3; i <= 3; i++) {
                            for (let j = -3; j <= 3; j++) {
                                if (Math.abs(i) === 3 && Math.abs(j) === 3) continue;
                                const dx = i * pix, dy = j * pix;
                                if (dx*dx + dy*dy <= rad*rad) {
                                    ctx.fillRect(cx + dx - pix/2, cy + dy - pix/2, pix, pix);
                                }
                            }
                        }
                        ctx.fillStyle = '#fff';
                        ctx.fillRect(cx - pix*2, cy - pix*2, pix, pix);
                    } else if (theme === 'nature') {
                        ctx.font = `${size * 0.6}px Arial`;
                        ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
                        ctx.fillText('🌰', drawX + size/2, drawY + size/2);
                    } else if (theme === 'flat') {
                        ctx.font = `${size * 0.55}px Arial`;
                        ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
                        ctx.fillText('💥', drawX + size/2, drawY + size/2);
                    } else {
                        const cx = drawX + size/2, cy = drawY + size/2, rad = size * 0.28;
                        ctx.fillStyle = '#000';
                        ctx.beginPath(); ctx.arc(cx, cy, rad, 0, Math.PI*2); ctx.fill();
                        ctx.fillStyle = 'rgba(255,255,255,0.2)';
                        ctx.beginPath(); ctx.arc(cx - rad*0.3, cy - rad*0.3, rad*0.4, 0, Math.PI*2); ctx.fill();
                        ctx.strokeStyle = '#000'; ctx.lineWidth = 1;
                        for (let i=0; i<8; i++) {
                            const a = (i/8)*Math.PI*2;
                            ctx.beginPath();
                            ctx.moveTo(cx + Math.cos(a)*rad, cy + Math.sin(a)*rad);
                            ctx.lineTo(cx + Math.cos(a)*(rad+3), cy + Math.sin(a)*(rad+3));
                            ctx.stroke();
                        }
                    }
                    if (flagged[row][col] === 1) drawFlag(drawX, drawY, size, flagColor, theme);
                } else if (board[row][col] > 0) {
                    const num = board[row][col];
                    ctx.fillStyle = numberColors[num-1] || '#000';
                    ctx.font = `bold ${Math.floor(size * fontSizeRatio)}px ${numberFont}`;
                    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
                    if (numShadow && numShadow !== 'none') {
                        ctx.shadowColor = numberColors[num-1] || '#000';
                        ctx.shadowBlur = 8;
                    }
                    ctx.fillText(num, drawX + size/2, drawY + size/2);
                    ctx.shadowBlur = 0;
                }
            } else {
                if (theme === 'retro') {
                    if (isPressed) {
                        ctx.fillStyle = '#C0C0C0';
                        ctx.fillRect(drawX, drawY, size, size);
                        ctx.fillStyle = '#808080';
                        ctx.fillRect(drawX, drawY, size, 3);
                        ctx.fillRect(drawX, drawY, 3, size);
                        ctx.fillStyle = '#ffffff';
                        ctx.fillRect(drawX, drawY + size - 3, size, 3);
                        ctx.fillRect(drawX + size - 3, drawY, 3, size);
                    } else {
                        ctx.fillStyle = unrevealedColor;
                        ctx.fillRect(drawX, drawY, size, size);
                        ctx.fillStyle = '#ffffff';
                        ctx.fillRect(drawX, drawY, size, 3);
                        ctx.fillRect(drawX, drawY, 3, size);
                        ctx.fillStyle = '#808080';
                        ctx.fillRect(drawX, drawY + size - 3, size, 3);
                        ctx.fillRect(drawX + size - 3, drawY, 3, size);
                    }
                } else if (theme === 'flat') {
                    if (isHovered) {
                        ctx.fillStyle = '#B0B0B8';
                    } else {
                        ctx.fillStyle = unrevealedColor;
                    }
                    ctx.beginPath();
                    ctx.roundRect(drawX, drawY, size, size, radius);
                    ctx.fill();
                } else if (theme === 'nature') {
                    ctx.save();
                    ctx.translate(drawX + size/2, drawY + size/2);
                    if (isHovered) {
                        ctx.rotate(hoverRotation * Math.PI / 180);
                        ctx.scale(1.05, 1.05);
                    }
                    ctx.translate(-size/2, -size/2);
                    ctx.fillStyle = unrevealedColor;
                    const offX = getNatureOffset(row, col, size);
                    const offY = getNatureOffset(row + 7, col + 13, size);
                    ctx.beginPath();
                    const pts = [
                        [0 + offX, 0 + offY],
                        [size + offX, 0 + offY],
                        [size + offX, size + offY],
                        [0 + offX, size + offY]
                    ];
                    ctx.moveTo(pts[0][0], pts[0][1]);
                    for (let i = 1; i < pts.length; i++) {
                        ctx.lineTo(pts[i][0], pts[i][1]);
                    }
                    ctx.closePath();
                    ctx.fill();
                    ctx.strokeStyle = borderColor;
                    ctx.lineWidth = 2;
                    ctx.setLineDash([5, 3]);
                    ctx.stroke();
                    ctx.setLineDash([]);
                    ctx.restore();
                } else {
                    ctx.fillStyle = unrevealedColor;
                    if (radius > 0) {
                        ctx.beginPath();
                        ctx.roundRect(drawX, drawY, size, size, radius);
                        ctx.fill();
                    } else {
                        ctx.fillRect(drawX, drawY, size, size);
                    }

                    if (bevel === 'true') {
                        ctx.strokeStyle = '#ffffff';
                        ctx.lineWidth = 2;
                        ctx.beginPath();
                        ctx.moveTo(drawX, drawY + size);
                        ctx.lineTo(drawX, drawY);
                        ctx.lineTo(drawX + size, drawY);
                        ctx.stroke();
                        ctx.strokeStyle = '#7b7b7b';
                        ctx.beginPath();
                        ctx.moveTo(drawX + size, drawY);
                        ctx.lineTo(drawX + size, drawY + size);
                        ctx.lineTo(drawX, drawY + size);
                        ctx.stroke();
                    }
                }

                if (theme !== 'retro' && theme !== 'flat' && theme !== 'nature') {
                    ctx.strokeStyle = borderColor;
                    ctx.lineWidth = borderWidth;
                    if (radius > 0) {
                        ctx.beginPath();
                        ctx.roundRect(drawX, drawY, size, size, radius);
                        ctx.stroke();
                    } else {
                        ctx.strokeRect(drawX, drawY, size, size);
                    }
                }

                if (flagged[row][col] === 1) {
                    drawFlag(drawX, drawY, size, flagColor, theme);
                } else if (flagged[row][col] === 2) {
                    ctx.fillStyle = questionColor;
                    ctx.font = `bold ${Math.floor(size * 0.5)}px ${numberFont}`;
                    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
                    ctx.fillText('?', drawX + size/2, drawY + size/2);
                }
            }
        }

        function drawFlag(x, y, s, color, theme) {
            if (theme === 'nature') {
                ctx.font = `${s * 0.6}px Arial`;
                ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
                ctx.fillText('🍀', x + s/2, y + s/2);
                return;
            }
            if (theme === 'flat') {
                ctx.font = `${s * 0.5}px Arial`;
                ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
                ctx.fillText('🚩', x + s/2, y + s/2);
                return;
            }
            if (theme === 'retro') {
                const cx = x + s/2, cy = y + s/2;
                const fw = s * 0.4, fh = s * 0.5;
                ctx.fillStyle = '#ff0000';
                ctx.beginPath();
                ctx.moveTo(cx - fw/2, cy - fh/2);
                ctx.lineTo(cx + fw/2, cy);
                ctx.lineTo(cx - fw/2, cy + fh/2);
                ctx.closePath();
                ctx.fill();
                ctx.fillStyle = '#000000';
                ctx.fillRect(cx - fw/2 - 1, cy - fh/2, 2, fh);
                return;
            }
            const cx = x + s/2, cy = y + s/2, f = s * 0.25;
            ctx.fillStyle = color;
            ctx.beginPath();
            ctx.moveTo(cx - f, cy - f); ctx.lineTo(cx + f, cy - f * 0.4); ctx.lineTo(cx - f, cy + f * 0.4);
            ctx.closePath(); ctx.fill();
            ctx.strokeStyle = '#fff'; ctx.lineWidth = 1.5;
            ctx.beginPath(); ctx.moveTo(cx - f, cy - f); ctx.lineTo(cx - f, cy + f); ctx.stroke();
        }

        if (!CanvasRenderingContext2D.prototype.roundRect) {
            CanvasRenderingContext2D.prototype.roundRect = function(x, y, w, h, radii) {
                const r = typeof radii === 'number' ? radii : (radii || 0);
                this.moveTo(x + r, y);
                this.arcTo(x + w, y, x + w, y + h, r);
                this.arcTo(x + w, y + h, x, y + h, r);
                this.arcTo(x, y + h, x, y, r);
                this.arcTo(x, y, x + w, y, r);
                this.closePath();
                return this;
            };
        }

        function revealCell(row, col) {
            if (!game || game.gameOver || game.win || game.isScrolling) return;
            if (row < 0 || row >= game.rows || col < 0 || col >= game.cols) return;
            if (game.revealed[row][col] || game.flagged[row][col] === 1) return;
            if (game.disabled && game.disabled[row][col]) return;
            if (game.firstClick) { placeMines(row, col); game.firstClick = false; startTimer(); }
            if (!game.endless && game.board[row][col] === -1 && isTwoChoiceProtection(row, col)) { handleTwoChoiceWin(row, col); return; }

            game.revealed[row][col] = true; game.score++;
            playSound('reveal'); vibrate(20);
            if (game.board[row][col] === -1) {
                if (game.endless) {
                    endlessHp -= 5; updateHpDisplay();
                    if (endlessHp <= 0) {
                        endlessHp = 0; game.gameOver = true; smileyBtn.textContent = '💀';
                        const sv = formatTime(Math.floor((performance.now() - endlessStartTime) / 1000));
                        showOverlay(`生命值耗尽！\n存活时间：${sv}`);
                    }
                    updateMinesCount(); return;
                } else {
                    game.flashingMine = { row, col };
                    game.gameOver = true; smileyBtn.textContent = '😵'; stopTimer();
                    playSound('boom'); vibrate(200);
                    for (let r = 0; r < game.rows; r++) for (let c = 0; c < game.cols; c++) if (game.board[r][c] === -1) game.revealed[r][c] = true;
                    showOverlay('踩到地雷！'); updateStatsAfterGame(false); return;
                }
            }
            if (game.board[row][col] === 0) {
                const stack = [[row, col]];
                while (stack.length) {
                    const [r, c] = stack.pop();
                    for (let dr = -1; dr <= 1; dr++) for (let dc = -1; dc <= 1; dc++) {
                        if (dr === 0 && dc === 0) continue;
                        const nr = r + dr, nc = c + dc;
                        if (nr >= 0 && nr < game.rows && nc >= 0 && nc < game.cols && !game.revealed[nr][nc] && game.flagged[nr][nc] !== 1) {
                            if (game.disabled && game.disabled[nr][nc]) continue;
                            game.revealed[nr][nc] = true; game.score++;
                            if (game.board[nr][nc] === 0) stack.push([nr, nc]);
                        }
                    }
                }
            }
            updateMinesCount(); checkWin();
            if (autoFlagEnabled && !game.gameOver && !game.win) autoFlagAllMatchingNumbers();
        }

        function handleTwoChoiceWin(row, col) {
            let otherRow = -1, otherCol = -1;
            for (let r = 0; r < game.rows; r++) for (let c = 0; c < game.cols; c++) if (!game.revealed[r][c] && !(r === row && c === col)) { otherRow = r; otherCol = c; }
            if (otherRow === -1) return;
            game.board[row][col] = 0; game.board[otherRow][otherCol] = -1;
            let count = 0;
            for (let dr = -1; dr <= 1; dr++) for (let dc = -1; dc <= 1; dc++) {
                const nr = row + dr, nc = col + dc;
                if (nr >= 0 && nr < game.rows && nc >= 0 && nc < game.cols && game.board[nr][nc] === -1) count++;
            }
            game.board[row][col] = count;
            game.flagged[otherRow][otherCol] = 1;
            game.revealed[row][col] = true;
            updateMinesCount();
            game.win = true; smileyBtn.textContent = '😎'; stopTimer();
            if (game.scrollTimer) clearInterval(game.scrollTimer);
            if (initialCellSizeForWin && game.cellSize !== initialCellSizeForWin) {
                setCellSize(initialCellSizeForWin, false);
                canvasWrapper.scrollTop = 0; canvasWrapper.scrollLeft = 0;
            }
            showOverlay('你赢了！（二选一保护）'); updateStatsAfterGame(true);
        }

        function isTwoChoiceProtection(row, col) {
            if (!game || game.gameOver || game.win) return false;
            if (game.board[row][col] !== -1 || game.revealed[row][col] || game.flagged[row][col] === 1) return false;
            let uc = 0, mc = 0;
            for (let r = 0; r < game.rows; r++) for (let c = 0; c < game.cols; c++) if (!game.revealed[r][c]) { uc++; if (game.board[r][c] === -1) mc++; }
            return uc === 2 && mc === 1;
        }

        function autoFlagAllMatchingNumbers() {
            if (!game || game.gameOver || game.win) return;
            for (let r = 0; r < game.rows; r++) for (let c = 0; c < game.cols; c++) {
                if (!game.revealed[r][c] || game.board[r][c] <= 0) continue;
                const allU = [], unF = [];
                for (let dr = -1; dr <= 1; dr++) for (let dc = -1; dc <= 1; dc++) {
                    if (dr === 0 && dc === 0) continue;
                    const nr = r + dr, nc = c + dc;
                    if (nr >= 0 && nr < game.rows && nc >= 0 && nc < game.cols && !game.revealed[nr][nc]) {
                        allU.push([nr, nc]); if (game.flagged[nr][nc] === 0) unF.push([nr, nc]);
                    }
                }
                if (allU.length === game.board[r][c]) for (const [nr, nc] of unF) game.flagged[nr][nc] = 1;
            }
            updateMinesCount(); draw();
        }

        function toggleFlag(r, c) {
            if (!game || game.gameOver || game.win || game.isScrolling) return;
            if (r < 0 || r >= game.rows || c < 0 || c >= game.cols) return;
            if (game.disabled && game.disabled[r][c]) return;
            if (!game.endless && game.revealed[r][c]) return;
            if (game.endless && game.revealed[r][c] && game.board[r][c] !== -1) return;
            const cur = game.flagged[r][c];
            let nf = 0; if (cur === 0) nf = 1; else if (cur === 1) nf = 2; else nf = 0;
            if (game.endless && cur === 0 && nf === 1 && !game.revealed[r][c] && game.board[r][c] !== -1) {
                endlessWrongFlagCount++;
                if (endlessWrongFlagCount >= 5) {
                    const d = Math.floor(endlessWrongFlagCount / 5) * 3;
                    endlessHp -= d; endlessWrongFlagCount = endlessWrongFlagCount % 5; updateHpDisplay();
                    if (endlessHp <= 0) {
                        endlessHp = 0; game.gameOver = true; smileyBtn.textContent = '💀';
                        const sv = formatTime(Math.floor((performance.now() - endlessStartTime) / 1000));
                        showOverlay(`生命值耗尽！\n存活时间：${sv}`);
                        updateEndlessStats(); return;
                    }
                }
            }
            game.flagged[r][c] = nf;
            playSound('flag'); vibrate(30);
            updateMinesCount(); updateEndlessStats(); draw();
            if (autoFlagEnabled && !game.gameOver && !game.win) autoFlagAllMatchingNumbers();
        }

        function chordCell(r, c) {
            if (!game || game.gameOver || game.win || game.isScrolling) return;
            if (r < 0 || r >= game.rows || c < 0 || c >= game.cols || !game.revealed[r][c] || game.board[r][c] <= 0) return;
            if (game.disabled && game.disabled[r][c]) return;
            let fc = 0; const uu = [];
            for (let dr = -1; dr <= 1; dr++) for (let dc = -1; dc <= 1; dc++) {
                if (dr === 0 && dc === 0) continue;
                const nr = r + dr, nc = c + dc;
                if (nr >= 0 && nr < game.rows && nc >= 0 && nc < game.cols) {
                    if (game.flagged[nr][nc] === 1) fc++;
                    else if (!game.revealed[nr][nc] && game.flagged[nr][nc] === 0) uu.push([nr, nc]);
                }
            }
            if (fc >= game.board[r][c]) { for (const [nr, nc] of uu) revealCell(nr, nc); }
            else { game.flashCells = uu; game.flashStartTime = performance.now(); }
        }

        function checkWin() {
            if (game.endless) return;
            for (let r = 0; r < game.rows; r++) for (let c = 0; c < game.cols; c++) {
                if (game.disabled && game.disabled[r][c]) continue;
                if (game.board[r][c] !== -1 && !game.revealed[r][c]) return;
            }
            game.win = true; handleWin();
        }

        function handleWin() {
            for (let r = 0; r < game.rows; r++) for (let c = 0; c < game.cols; c++) if (!game.revealed[r][c] && game.flagged[r][c] === 0 && (!game.disabled || !game.disabled[r][c])) game.flagged[r][c] = 1;
            updateMinesCount(); smileyBtn.textContent = '😎'; stopTimer(); playSound('win'); vibrate([50,50,100]);
            if (game.scrollTimer) clearInterval(game.scrollTimer);
            if (initialCellSizeForWin && game.cellSize !== initialCellSizeForWin) {
                setCellSize(initialCellSizeForWin, false);
                canvasWrapper.scrollTop = 0; canvasWrapper.scrollLeft = 0;
            }
            showOverlay('你赢了！'); updateStatsAfterGame(true);
        }

        function updateStatsAfterGame(win) {
            const st = loadStats(); st.totalGames++;
            if (win) st.totalWins++;
            if (win && !game.endless) { if (!st.bestTimes[mode] || elapsedSeconds < st.bestTimes[mode]) st.bestTimes[mode] = elapsedSeconds; }
            saveStats(st); updateStatsDisplay();
        }

        function updateMinesCount() {
            if (!game) return;
            let tm = game.mines;
            if (game.endless) { tm = 0; for (let r = 0; r < game.rows; r++) for (let c = 0; c < game.cols; c++) if (game.board[r][c] === -1) tm++; }
            const fl = game.flagged.flat().filter(f => f === 1).length;
            minesCountSpan.textContent = (tm - fl).toString().padStart(3, '0');
        }
        function updateHpDisplay() { hpDisplay.textContent = `❤️${endlessHp}`; hpDisplay.style.color = '#ff0000'; setTimeout(() => hpDisplay.style.color = '#ff6b6b', 300); }
        function updateEndlessStats() { if (game && game.endless) endlessStats.textContent = `错旗: ${endlessWrongFlagCount}/5\n未标雷: ${endlessUnmarkedMineCount}/3`; }
        function formatTime(s) { const m = Math.floor(s / 60), sec = s % 60; return `${m.toString().padStart(2,'0')}:${sec.toString().padStart(2,'0')}`; }

        function performScroll() {
            if (!game || !game.endless || game.gameOver || game.win || game.isScrolling) return;
            game.isScrolling = true;
            const sr = 5, sd = sr * game.effectiveCellSize, dur = 400, st = performance.now();
            const sb = game.board.map(r => r.slice()), srv = game.revealed.map(r => r.slice()), sfl = game.flagged.map(r => r.slice());
            function anim(now) {
                const el = now - st, p = Math.min(el / dur, 1), off = Math.floor(sd * p);
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                for (let r = 0; r < game.rows; r++) for (let c = 0; c < game.cols; c++) {
                    const x = c * game.effectiveCellSize, y = r * game.effectiveCellSize - off;
                    if (y + game.effectiveCellSize < 0) continue;
                    drawCellAt(r, c, x, y, sb, srv, sfl);
                }
                if (p < 1) requestAnimationFrame(anim); else completeScroll();
            }
            requestAnimationFrame(anim);
        }

        function completeScroll() {
            let um = 0;
            for (let r = 0; r < 5; r++) for (let c = 0; c < game.cols; c++) if (game.board[r][c] === -1 && game.flagged[r][c] !== 1) um++;
            if (um > 0) {
                endlessUnmarkedMineCount += um;
                while (endlessUnmarkedMineCount >= 3) {
                    endlessUnmarkedMineCount -= 3; endlessHp -= 2; updateHpDisplay();
                    if (endlessHp <= 0) {
                        endlessHp = 0; game.gameOver = true; smileyBtn.textContent = '💀';
                        const sv = formatTime(Math.floor((performance.now() - endlessStartTime) / 1000));
                        showOverlay(`生命值耗尽！\n存活时间：${sv}`);
                        game.isScrolling = false; return;
                    }
                }
            }
            for (let i = 0; i < 5; i++) { game.board.shift(); game.revealed.shift(); game.flagged.shift(); }
            const mp = game.mines / (game.rows * game.cols);
            for (let i = 0; i < 5; i++) {
                const br = [], rr = [], fr = [];
                for (let c = 0; c < game.cols; c++) { br.push(Math.random() < mp ? -1 : 0); rr.push(false); fr.push(0); }
                game.board.push(br); game.revealed.push(rr); game.flagged.push(fr);
            }
            for (let r = 0; r < game.rows; r++) for (let c = 0; c < game.cols; c++) {
                if (game.board[r][c] === -1) continue;
                let n = 0;
                for (let dr = -1; dr <= 1; dr++) for (let dc = -1; dc <= 1; dc++) {
                    const nr = r + dr, nc = c + dc;
                    if (nr >= 0 && nr < game.rows && nc >= 0 && nc < game.cols && game.board[nr][nc] === -1) n++;
                }
                game.board[r][c] = n;
            }
            if (game.flashingMine && game.flashingMine.row < 5) game.flashingMine = null;
            updateMinesCount(); updateEndlessStats();
            game.isScrolling = false; endlessPhase = 'loading'; endlessPhaseStartTime = performance.now();
            rainbowBar.style.width = '0%'; draw();
            if (autoFlagEnabled) autoFlagAllMatchingNumbers();
        }

        function updateRainbowBar() {
            if (!game || !game.endless || game.gameOver || game.win || game.isScrolling) return;
            const now = performance.now();
            let p = 0;
            if (endlessPhase === 'countdown') {
                const el = now - endlessPhaseStartTime;
                p = Math.max(0, 1 - el / ENDLESS_COUNTDOWN_MS);
                if (el >= ENDLESS_COUNTDOWN_MS) { endlessPhase = 'loading'; endlessPhaseStartTime = now; p = 0; }
            } else {
                const el = now - endlessPhaseStartTime;
                p = Math.min(1, el / ENDLESS_LOADING_MS);
                if (p >= 1) { performScroll(); return; }
            }
            rainbowBar.style.width = (p * 100) + '%';
        }

        function showOverlay(t) { resultText.textContent = t; overlay.style.display = 'flex'; }
        function draw() {
            if (!game) return;
            const { rows, cols, board, revealed, flagged } = game;
            const effective = game.effectiveCellSize;
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            const fl = performance.now() - game.flashStartTime < FLASH_DURATION_MS;
            const fs = fl ? new Set(game.flashCells.map(([r,c]) => `${r},${c}`)) : null;
            for (let r = 0; r < rows; r++) for (let c = 0; c < cols; c++) {
                const x = c * effective, y = r * effective;
                if (fs && fs.has(`${r},${c}`) && !revealed[r][c] && flagged[r][c] === 0) {
                    ctx.fillStyle = '#ffd43b';
                    ctx.fillRect(x, y, effective, effective);
                    ctx.strokeStyle = '#1e1e2e';
                    ctx.lineWidth = 0.5;
                    ctx.strokeRect(x, y, effective, effective);
                    continue;
                }
                const fm = game.flashingMine && r === game.flashingMine.row && c === game.flashingMine.col && revealed[r][c] && board[r][c] === -1;
                drawCellAt(r, c, x, y, board, revealed, flagged, fm);
            }
        }
        function gameLoop() {
            if (!game) return;
            if (!game.isScrolling) {
                draw();
                if (game.endless && !game.gameOver && !game.win) updateRainbowBar();
            }
            game.animationId = requestAnimationFrame(gameLoop);
        }
        function setCellSize(ns, keep = true) {
            if (!game) return;
            ns = Math.max(minCellSize, Math.min(maxCellSize, ns));
            if (ns === game.cellSize) return;
            const ow = canvas.width, oh = canvas.height;
            const rx = keep ? canvasWrapper.scrollLeft / ow : 0, ry = keep ? canvasWrapper.scrollTop / oh : 0;
            game.cellSize = ns;
            game.effectiveCellSize = ns + game.gap;
            canvas.width = game.cols * game.effectiveCellSize;
            canvas.height = game.rows * game.effectiveCellSize;
            canvas.style.width = canvas.width + 'px';
            canvas.style.height = canvas.height + 'px';
            if (keep) { canvasWrapper.scrollLeft = rx * canvas.width; canvasWrapper.scrollTop = ry * canvas.height; }
            else { canvasWrapper.scrollLeft = 0; canvasWrapper.scrollTop = 0; }
            draw();
        }

        function getGridPosition(e) {
            const rect = canvas.getBoundingClientRect();
            const sx = canvas.width / rect.width, sy = canvas.height / rect.height;
            let cx, cy;
            if (e.touches && e.touches.length > 0) { cx = e.touches[0].clientX; cy = e.touches[0].clientY; }
            else { cx = e.clientX; cy = e.clientY; }
            const mx = (cx - rect.left) * sx, my = (cy - rect.top) * sy;
            const effective = game.effectiveCellSize;
            return { row: Math.floor(my / effective), col: Math.floor(mx / effective) };
        }
        function onPointerDown(e) {
            if (isPinching || game?.isScrolling) return;
            if (!game || game.gameOver || game.win) return;
            if (e.button === 2) {
                e.preventDefault();
                const p = getGridPosition(e);
                if (p.row < 0 || p.row >= game.rows || p.col < 0 || p.col >= game.cols) return;
                if (game.disabled && game.disabled[p.row][p.col]) return;
                if (game.revealed[p.row][p.col] && game.board[p.row][p.col] > 0) chordCell(p.row, p.col);
                else toggleFlag(p.row, p.col);
                return;
            }
            e.preventDefault();
            const p = getGridPosition(e);
            if (p.row < 0 || p.row >= game.rows || p.col < 0 || p.col >= game.cols) return;
            if (game.disabled && game.disabled[p.row][p.col]) return;
            
            pressedCells.clear();
            pressedCells.add(`${p.row},${p.col}`);

            const cx = e.touches ? e.touches[0].clientX : e.clientX, cy = e.touches ? e.touches[0].clientY : e.clientY;
            pressStartClientX = cx; pressStartClientY = cy; pressStartPos = p;
            longPressTriggered = false; isDragging = false;
            longPressTimer = setTimeout(() => {
                if (pressStartPos) { const pr = pressStartPos.row, pc = pressStartPos.col; if (!game.revealed[pr][pc]) revealCell(pr, pc); longPressTriggered = true; }
            }, LONG_PRESS_MS);
        }
        function onPointerMove(e) {
            if (isPinching || game?.isScrolling) return;
            if (!game || game.gameOver || game.win) return;
            
            const cx = e.touches ? e.touches[0].clientX : e.clientX, cy = e.touches ? e.touches[0].clientY : e.clientY;
            
            if (!e.touches) {
                const rect = canvas.getBoundingClientRect();
                const sx = canvas.width / rect.width, sy = canvas.height / rect.height;
                const mx = (cx - rect.left) * sx, my = (cy - rect.top) * sy;
                const effective = game.effectiveCellSize;
                const hr = Math.floor(my / effective);
                const hc = Math.floor(mx / effective);
                if (hr !== hoveredCell.row || hc !== hoveredCell.col) {
                    hoveredCell.row = hr;
                    hoveredCell.col = hc;
                    hoverRotation = (Math.random() * 4 - 2);
                }
            }
            
            if (!pressStartPos) return;
            const dx = Math.abs(cx - pressStartClientX), dy = Math.abs(cy - pressStartClientY);
            if (dx > DRAG_THRESHOLD || dy > DRAG_THRESHOLD) { 
                isDragging = true; 
                pressedCells.clear();
                if (longPressTimer) { clearTimeout(longPressTimer); longPressTimer = null; } 
                longPressTriggered = false; 
            }
        }
        function onPointerUp(e) {
            if (isPinching || game?.isScrolling) return;
            if (!game || game.gameOver || game.win) return;
            if (e.button === 2) return;
            e.preventDefault();
            
            pressedCells.clear();
            
            if (longPressTimer) { clearTimeout(longPressTimer); longPressTimer = null; }
            if (isDragging) { pressStartPos = null; isDragging = false; return; }
            if (longPressTriggered) { pressStartPos = null; longPressTriggered = false; return; }
            if (pressStartPos) {
                const pr = pressStartPos.row, pc = pressStartPos.col;
                if (game.firstClick) revealCell(pr, pc);
                else if (game.endless && game.revealed[pr][pc] && game.board[pr][pc] === -1) toggleFlag(pr, pc);
                else if (game.revealed[pr][pc] && game.board[pr][pc] > 0) chordCell(pr, pc);
                else if (!game.revealed[pr][pc]) toggleFlag(pr, pc);
            }
            pressStartPos = null; longPressTriggered = false;
        }
        function onPointerLeave() { 
            if (longPressTimer) { clearTimeout(longPressTimer); longPressTimer = null; } 
            pressStartPos = null; longPressTriggered = false; isDragging = false; 
            pressedCells.clear();
            hoveredCell.row = -1; hoveredCell.col = -1;
        }
        function getDistance(t1, t2) { const dx = t1.clientX - t2.clientX, dy = t1.clientY - t2.clientY; return Math.sqrt(dx * dx + dy * dy); }

        canvas.addEventListener('touchstart', e => { 
            if (e.touches.length === 2) { 
                e.preventDefault(); isPinching = true; 
                pinchStartDistance = getDistance(e.touches[0], e.touches[1]); 
                pinchStartCellSize = game ? game.cellSize : maxCellSize; 
                if (longPressTimer) { clearTimeout(longPressTimer); longPressTimer = null; } 
                longPressTriggered = false; pressStartPos = null; 
                pressedCells.clear();
            } 
        }, { passive: false });
        canvas.addEventListener('touchmove', e => { 
            if (isPinching && e.touches.length === 2) { 
                e.preventDefault(); 
                const nd = getDistance(e.touches[0], e.touches[1]); 
                setCellSize(Math.round(pinchStartCellSize * (nd / pinchStartDistance)), true); 
            } 
        }, { passive: false });
        canvas.addEventListener('touchend', e => { if (e.touches.length < 2) { isPinching = false; pinchStartDistance = 0; } });
        canvas.addEventListener('touchcancel', () => { isPinching = false; pinchStartDistance = 0; });
        canvas.addEventListener('pointerdown', onPointerDown);
        canvas.addEventListener('pointermove', onPointerMove);
        canvas.addEventListener('pointerup', onPointerUp);
        canvas.addEventListener('pointerleave', onPointerLeave);
        canvas.addEventListener('pointercancel', onPointerLeave);
        canvas.addEventListener('contextmenu', e => e.preventDefault());

        editorCanvas.addEventListener('pointerdown', handleEditorClick);

        toolDeleteBtn.addEventListener('click', () => { customTool = 'delete'; updateToolButtons(); });
        toolAddBtn.addEventListener('click', () => { customTool = 'add'; updateToolButtons(); });
        toolMineBtn.addEventListener('click', () => { customTool = 'mine'; updateToolButtons(); });
        btnStartEdit.addEventListener('click', startCustomGame);

        editRowsInput.addEventListener('click', () => showNumKeyboard(editRowsInput));
        editColsInput.addEventListener('click', () => showNumKeyboard(editColsInput));
        inputRowsDialog.addEventListener('click', () => showNumKeyboard(inputRowsDialog));
        inputColsDialog.addEventListener('click', () => showNumKeyboard(inputColsDialog));
        inputMinesDialog.addEventListener('click', () => showNumKeyboard(inputMinesDialog));

        btnRestart.addEventListener('click', restartGame);
        btnMenu.addEventListener('click', exitToMenu);
        smileyBtn.addEventListener('click', restartGame);
        btnHome.addEventListener('click', exitToMenu);
        btnAutoFlag.addEventListener('click', () => { autoFlagEnabled = !autoFlagEnabled; updateAutoFlagButton(); if (game && !game.firstClick) restartGame(); });
        
        btnClearStats.addEventListener('click', () => {
            if (confirm('确定要清除所有统计数据吗？')) {
                storage.removeItem('minesweeper_stats');
                updateStatsDisplay();
            }
        });

        btnCustomConfirm.addEventListener('click', () => {
            let rows = parseInt(inputRowsDialog.value) || 9;
            let cols = parseInt(inputColsDialog.value) || 9;
            let mines = parseInt(inputMinesDialog.value) || 10;
            rows = Math.max(5, Math.min(30, rows)); 
            cols = Math.max(5, Math.min(30, cols));
            const maxMines = rows * cols - 1; 
            mines = Math.max(1, Math.min(maxMines, mines));
            inputRowsDialog.value = rows; 
            inputColsDialog.value = cols; 
            inputMinesDialog.value = mines;
            customConfig = { rows, cols, mines };
            customDialog.style.display = 'none';
            
            menuDiv.style.display = 'none';
            loadingOverlay.style.display = 'flex';
            tipText.textContent = TIPS[Math.floor(Math.random() * TIPS.length)];
            if (loadingTimer) clearTimeout(loadingTimer);
            loadingTimer = setTimeout(() => {
                loadingOverlay.style.display = 'none';
                gameDiv.style.display = 'flex';
                overlay.style.display = 'none';
                initGame();
            }, 1500);
        });
        btnCustomCancel.addEventListener('click', () => { customDialog.style.display = 'none'; });

        btnArchive.addEventListener('click', () => {
            updateArchiveDisplay();
            archiveOverlay.style.display = 'flex';
        });
        btnCloseArchive.addEventListener('click', () => {
            archiveOverlay.style.display = 'none';
        });

        btnSaveCustom.addEventListener('click', () => {
            const str = serializeGrid();
            saveArchive(str);
            alert('已保存到存档！');
        });

        btnLoadCustom.addEventListener('click', () => {
            loadOverlay.style.display = 'flex';
            loadInput.value = '';
            loadInput.focus();
        });
        btnLoadCancel.addEventListener('click', () => {
            loadOverlay.style.display = 'none';
        });
        btnLoadConfirm.addEventListener('click', () => {
            const str = loadInput.value.trim();
            if (!str) { alert('请输入存档字符'); return; }
            const result = deserializeGrid(str);
            if (!result) { alert('无效的存档字符'); return; }
            customRows = result.rows;
            customCols = result.cols;
            customGrid = result.grid;
            editRowsInput.value = customRows;
            editColsInput.value = customCols;
            resizeEditorCanvas();
            renderEditor();
            loadOverlay.style.display = 'none';
        });

        btnPasteArchive.addEventListener('click', async () => {
            try {
                const text = await navigator.clipboard.readText();
                if (text) {
                    loadInput.value = text;
                } else {
                    alert('剪贴板为空');
                }
            } catch (err) {
                // 兼容 file:// 协议或部分浏览器下剪贴板读取受限的情况
                alert('无法自动读取剪贴板，请长按输入框手动粘贴');
            }
        });

        loadSettings(); updateStatsDisplay();
        themeButtons.addEventListener('click', e => {
            if (e.target.tagName === 'BUTTON') {
                currentTheme = e.target.dataset.theme;
                document.body.dataset.theme = currentTheme;
                saveSettings(); updateThemeButtons();
                if (game) {
                    const gap = parseInt(getComputedStyle(document.body).getPropertyValue('--cell-gap')) || 0;
                    game.gap = gap;
                    game.effectiveCellSize = game.cellSize + gap;
                    canvas.width = game.cols * game.effectiveCellSize;
                    canvas.height = game.rows * game.effectiveCellSize;
                    canvas.style.width = canvas.width + 'px';
                    canvas.style.height = canvas.height + 'px';
                    draw();
                }
                if (editorOverlay.style.display === 'flex') {
                    renderEditor();
                }
            }
        });
        soundToggle.addEventListener('change', () => {
            soundEnabled = soundToggle.checked;
            saveSettings();
            if (soundEnabled) playSound('reveal');
        });
        vibrateToggle.addEventListener('change', () => {
            vibrateEnabled = vibrateToggle.checked;
            saveSettings();
            if (vibrateEnabled) vibrate(50);
        });
        btnCloseSettings.addEventListener('click', () => { settingsDialog.style.display = 'none'; });
        document.getElementById('btn-settings').addEventListener('click', () => { settingsDialog.style.display = 'flex'; });
        btnCloseTutorial.addEventListener('click', () => { tutorialOverlay.style.display = 'none'; });

        document.addEventListener('keydown', e => {
            if (menuDiv.style.display !== 'none') {
                if (e.key === 'ArrowDown' || e.key === 'ArrowUp') { e.preventDefault(); navigateMenu(e.key === 'ArrowDown' ? 1 : -1); }
                else if (e.key === 'Enter') { e.preventDefault(); startGame(menuItems[menuIndex].dataset.mode); }
            } else if (e.key === 'Escape') exitToMenu();
        });

        menuItems.forEach((item, index) => {
            item.addEventListener('click', () => { menuIndex = index; updateMenuSelection(); startGame(item.dataset.mode); });
            item.addEventListener('mouseenter', () => { menuIndex = index; updateMenuSelection(); });
        });

        document.addEventListener('touchmove', e => { if (gameDiv.style.display !== 'none' && !canvasWrapper.contains(e.target)) e.preventDefault(); }, { passive: false });

        function handleResize() { updateZoomBounds(); if (game && !game.gameOver && !game.win) restartGame(); }
        window.addEventListener('resize', handleResize);

        function showNumKeyboard(f) { 
            currentInputField = f; 
            numKeyboard.style.display = 'grid'; 
            isNewInput = true;
        }
        function hideNumKeyboard() { numKeyboard.style.display = 'none'; currentInputField = null; }
        
        function updateEditorSizeFromInputs() {
            let rows = parseInt(editRowsInput.value);
            let cols = parseInt(editColsInput.value);
            if (isNaN(rows)) rows = customRows;
            if (isNaN(cols)) cols = customCols;
            rows = Math.max(5, Math.min(30, rows));
            cols = Math.max(5, Math.min(30, cols));
            if (rows === customRows && cols === customCols) return;
            customRows = rows;
            customCols = cols;
            customGrid = Array.from({ length: customRows }, () => Array(customCols).fill(0));
            resizeEditorCanvas();
            renderEditor();
        }

        document.querySelectorAll('#num-keyboard button').forEach(btn => {
            btn.addEventListener('click', () => {
                if (!currentInputField) return;
                const key = btn.textContent;
                
                if (key === '←') {
                    currentInputField.value = currentInputField.value.slice(0, -1);
                    isNewInput = false;
                    if (currentInputField.id === 'edit-rows' || currentInputField.id === 'edit-cols') {
                        updateEditorSizeFromInputs();
                    }
                } else if (key === '确定') {
                    hideNumKeyboard();
                    if (currentInputField.id === 'edit-rows' || currentInputField.id === 'edit-cols') {
                        if (editRowsInput.value === '') editRowsInput.value = 7;
                        if (editColsInput.value === '') editColsInput.value = 7;
                        updateEditorSizeFromInputs();
                    } else if (currentInputField.id === 'input-rows-dialog' || currentInputField.id === 'input-cols-dialog' || currentInputField.id === 'input-mines-dialog') {
                        let rows = parseInt(inputRowsDialog.value) || 9;
                        let cols = parseInt(inputColsDialog.value) || 9;
                        let mines = parseInt(inputMinesDialog.value) || 10;
                        rows = Math.max(5, Math.min(30, rows));
                        cols = Math.max(5, Math.min(30, cols));
                        const maxMines = rows * cols - 1;
                        mines = Math.max(1, Math.min(maxMines, mines));
                        inputRowsDialog.value = rows;
                        inputColsDialog.value = cols;
                        inputMinesDialog.value = mines;
                        customConfig = { rows, cols, mines };
                        customDialog.style.display = 'none';
                        menuDiv.style.display = 'none';
                        loadingOverlay.style.display = 'flex';
                        tipText.textContent = TIPS[Math.floor(Math.random() * TIPS.length)];
                        if (loadingTimer) clearTimeout(loadingTimer);
                        loadingTimer = setTimeout(() => {
                            loadingOverlay.style.display = 'none';
                            gameDiv.style.display = 'flex';
                            overlay.style.display = 'none';
                            initGame();
                        }, 1500);
                    }
                } else if (/^\d$/.test(key)) {
                    if (isNewInput) {
                        currentInputField.value = key;
                        isNewInput = false;
                    } else {
                        if (currentInputField.value.length < 2) currentInputField.value += key;
                    }
                    if (currentInputField.id === 'edit-rows' || currentInputField.id === 'edit-cols') {
                        updateEditorSizeFromInputs();
                    }
                }
            });
        });

        updateMenuSelection();
    </script>
</body>
